# Windows (.exe) ve macOS (.dmg) paketlerini GitHub'ın sunucularında derler.
# - "v1.0.1" gibi bir etiket gönderilince paketler bir GitHub Release olarak yayımlanır.
# - Elle çalıştırma (Actions > Derle > Run workflow) sadece derler; çıktılar "Artifacts" altında olur.
name: Derle

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  derle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: macOS paketi
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Windows paketi
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: BaskiAdasi-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  yayimla:
    needs: derle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paketler
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: paketler/*
          generate_release_notes: true
          body: |
            ## İndir

            | Sistem | Dosya |
            |---|---|
            | Windows (önerilen) | `BaskiAdasi-…-kurulum.exe` |
            | Windows (kurulumsuz) | `BaskiAdasi-…-tasinabilir.exe` |
            | Mac (Apple Silicon: M1/M2/M3/M4) | `BaskiAdasi-…-arm64.dmg` |
            | Mac (Intel) | `BaskiAdasi-…-x64.dmg` |

            Paketler imzasız. İlk açılışta Windows SmartScreen ya da macOS Gatekeeper uyarısı çıkarsa README'deki adımlara bak.
